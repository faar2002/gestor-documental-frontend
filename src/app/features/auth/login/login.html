<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4 style-card" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock-fill text-primary display-4"></i>
      <h3 class="mt-2 fw-bold">Gestor Documental</h3>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger p-2 small text-center" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <!-- Paso 1: Autenticación con Credenciales -->
    @if (!showRoleSelection()) {
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Correo Electrónico</label>
          <input 
            type="email" 
            class="form-control" 
            [(ngModel)]="credentials.email" 
            name="email" 
            required />
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input 
            type="password" 
            class="form-control" 
            [(ngModel)]="credentials.password" 
            name="password" 
            required />
        </div>

        <button 
          type="submit" 
          class="btn btn-primary w-100" 
          [disabled]="!loginForm.form.valid || isLoading()">
          @if (isLoading()) {
            <span class="spinner-border spinner-border-sm me-1"></span> Verificando...
          } @else {
            Ingresar
          }
        </button>
      </form>
    } 
    <!-- Paso 2: Selección de Rol (Fuera del Tag <form>) -->
    @else {
      <div class="text-center mb-3">
        <h5 class="fw-bold text-secondary">Selección de Rol</h5>
        <p class="text-muted small mb-0">
          Tu cuenta posee múltiples roles. Elige el rol con el que operarás en esta sesión:
        </p>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Rol Activo</label>
        <select class="form-select" [(ngModel)]="selectedRoleId" name="selectedRoleId">
          @for (role of availableRoles(); track role.id) {
            <option [value]="role.id">
              {{ role.name | titlecase }} - {{ role.description || 'Sin descripción' }}
            </option>
          }
        </select>
      </div>

      <button 
        type="button" 
        class="btn btn-success w-100" 
        (click)="onConfirmRole()">
        <i class="bi bi-box-arrow-in-right me-1"></i> Continuar a la Aplicación
      </button>
    }
  </div>
</div>
